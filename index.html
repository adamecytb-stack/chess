<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Knight School – free chess course</title>
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knight School">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#14161c; --card:#1e222b; --card2:#272c37; --line:#323846;
  --text:#eceef2; --muted:#9aa3b2; --accent:#f2b84b; --accent-ink:#2a1e05;
  --good:#5ecb8b; --bad:#ef6b6b;
  --sq-light:#e8ead9; --sq-dark:#6a9488;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:0 16px calc(24px + env(safe-area-inset-bottom));
  padding-top:env(safe-area-inset-top)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
.muted{color:var(--muted)}

/* ---------- home ---------- */
.hero{padding:28px 0 18px}
.hero h1{font-size:30px;letter-spacing:-.5px}
.hero h1 span{color:var(--accent)}
.hero p{margin:6px 0 0;color:var(--muted)}
.progress{margin:18px 0 6px;height:10px;border-radius:99px;background:var(--card2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.progress-label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:10px 18px;
  border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.btn:active{transform:translateY(1px);filter:brightness(.95)}
.btn.ghost{background:var(--card2);color:var(--text);font-weight:600}
.btn small{font-weight:500;opacity:.8;font-size:13px;display:block}
.btn.col{flex-direction:column;gap:0}
.unit{margin-top:26px}
.unit-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.unit-icon{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;flex:none}
.unit-icon svg{width:30px;height:30px}
.unit-head h2{font-size:18px}
.unit-head p{margin:0;font-size:13px;color:var(--muted)}
.lessons{background:var(--card);border-radius:16px;overflow:hidden}
.lesson{display:flex;width:100%;text-align:left;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line)}
.lesson:first-child{border-top:0}
.lesson:active{background:var(--card2)}
.lesson .num{width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;
  font-size:13px;font-weight:700;color:var(--muted);flex:none}
.lesson.done .num{background:var(--good);color:#0c2a19}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block;font-weight:600}
.lesson .t span{display:block;font-size:13px;color:var(--muted)}
.stars{color:var(--accent);letter-spacing:1px;font-size:15px;white-space:nowrap}
.stars .off{color:var(--line)}
.foot{margin:30px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.foot button{color:var(--muted);text-decoration:underline;padding:10px}

/* ---------- lesson intro / result ---------- */
.top{display:flex;align-items:center;gap:6px;height:52px;margin:0 -8px}
.back{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none}
.back:active{background:var(--card2)}
.top .ttl{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .count{font-size:13px;color:var(--muted);padding-right:10px;white-space:nowrap}
.intro h1{font-size:26px;margin-top:8px}
.intro .sub{color:var(--muted);margin:4px 0 16px}
.intro .card{background:var(--card);border-radius:16px;padding:6px 16px;margin-bottom:18px}
.intro .card p{margin:12px 0}
.stack{display:grid;gap:10px}
.result{text-align:center;padding-top:8vh}
.result .big{font-size:54px;letter-spacing:6px;color:var(--accent)}
.result .big .off{color:var(--line)}
.result h1{font-size:26px;margin:8px 0 6px}
.result p{color:var(--muted);margin:0 0 26px}

/* ---------- player ---------- */
.player{display:flex;flex-direction:column;height:100dvh;margin:0 -16px;padding-bottom:env(safe-area-inset-bottom)}
.player .top{margin:0;padding:0 8px;flex:none}
.dots{display:flex;gap:5px;padding:0 16px 8px;flex:none}
.dots i{flex:1;height:4px;border-radius:9px;background:var(--card2)}
.dots i.on{background:var(--accent)}
.dots i.now{background:var(--text)}
.board-wrap{flex:none;display:flex;justify-content:center}
.board{--size:min(100vw,560px,calc(100dvh - 300px));width:var(--size);height:var(--size);display:grid;
  grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);user-select:none;touch-action:manipulation}
.sq{position:relative;display:block;min-width:0;min-height:0}
.sq.l{background:var(--sq-light)} .sq.d{background:var(--sq-dark)}
.sq svg{position:absolute;inset:1%;width:98%;height:98%;pointer-events:none}
.sq.last::before{content:"";position:absolute;inset:0;background:rgba(242,184,75,.45)}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(242,184,75,.75)}
.sq.check::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(239,107,107,.95) 20%,rgba(239,107,107,0) 75%)}
.sq.wrong::before{content:"";position:absolute;inset:0;background:rgba(239,107,107,.8)}
.sq.hint::after{content:"";position:absolute;inset:3%;border:4px solid #2f7de1;border-radius:50%;animation:pulse 1s infinite alternate}
.sq.dot::after{content:"";position:absolute;inset:34%;border-radius:50%;background:rgba(20,22,28,.32)}
.sq.dot.occ::after{inset:4%;background:none;border:5px solid rgba(20,22,28,.32)}
.sq em{position:absolute;font:700 10px/1 system-ui,sans-serif;font-style:normal;opacity:.75;pointer-events:none}
.sq em.r{left:3px;top:3px} .sq em.f{right:3px;bottom:2px}
.sq.l em{color:var(--sq-dark)} .sq.d em{color:var(--sq-light)}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
.pw{fill:#fbf8ef;stroke:#23242a} .pb{fill:#2a2b33;stroke:#0c0c10}
.pw .ink{fill:#23242a;stroke:none} .pb .ink{fill:#d9dbe2;stroke:none}
.pw .cut{stroke:#23242a;fill:none} .pb .cut{stroke:#d9dbe2;fill:none}
.coach{flex:1;min-height:0;overflow-y:auto;padding:10px 16px 4px;display:flex;flex-direction:column;gap:6px}
.msg{background:var(--card);border-radius:12px;padding:9px 12px;font-size:15px;line-height:1.4}
.msg b.mv{font-variant-numeric:tabular-nums;margin-right:4px}
.msg.old{opacity:.55}
.msg.me b.mv{color:var(--good)}
.msg.todo{background:var(--card2);border-left:4px solid var(--accent)}
.msg.oops{border-left:4px solid var(--bad);background:var(--card2)}
.msg.win{border-left:4px solid var(--good);background:var(--card2);font-weight:600}
.actions{flex:none;display:flex;gap:10px;padding:8px 16px 12px}
.actions .btn{min-height:50px}
.actions .btn.ghost{flex:0 0 auto;width:auto;padding:10px 18px}
.actions .grow{flex:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<noscript>This course needs JavaScript.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
